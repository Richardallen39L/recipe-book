<style>
:root{
  color-scheme:light;
  --bg:#f4f6fa; --panel:#ffffff; --ink:#1d2229; --muted:#667080; --line:#dde3ec; --accent:#2f6fba; --accent-ink:#ffffff;
  --accent-soft:#e3edf9; --title:#000000; --blue:#2f6fba; --ok:#1f7a3d; --ok-bg:#e1f3e7; --warn:#a15c00; --warn-bg:#fff0d6; --bad:#b3261e; --bad-bg:#fde4e1;
  --grey-bg:#ececec; --input:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
  --cat:var(--blue); --hdr1:#10294a; --hdr2:#2f6fba; --tint:12%;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
header.top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:linear-gradient(90deg,var(--hdr1),var(--hdr2));border-bottom:1px solid var(--line);flex:none}
header.top h1{font-size:19px;margin:0 14px 0 0;color:#fff;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
header.top .btn{background:rgba(255,255,255,.92);color:#2a211c;border-color:transparent}
header.top h1 .hver{font-size:12px;font-weight:400;opacity:.85;margin-left:4px;text-shadow:none}
header.top .btn:hover{background:#fff}
header.top .btn.primary{background:#ffe9a8;color:#3d2a00;border-color:#ffd978}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px;line-height:1.2;display:inline-block;color:var(--ink);text-decoration:none}
.btn:hover{background:var(--grey-bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:3px 8px;font-size:13px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.spacer{flex:1}
#app{flex:1;display:flex;min-height:0}
#app.nc aside{display:none}
aside{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside .tools{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
aside input[type=search],aside select{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--input)}
#list{overflow:auto;flex:1;padding:4px 0 20px}
#list h3{margin:12px 0 4px;padding:3px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--cat);font-weight:700;background:color-mix(in srgb,var(--cat) var(--tint),transparent);border-left:5px solid var(--cat)}
#list a{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 11px;color:var(--ink);text-decoration:none;cursor:pointer;border-left:5px solid color-mix(in srgb,var(--cat) 35%,transparent)}
#list a:hover{background:var(--grey-bg)}
#list a.sel{background:color-mix(in srgb,var(--blue) 16%,var(--panel));border-left-color:var(--blue);font-weight:600}
#list .dot{width:9px;height:9px;border-radius:50%;flex:none;background:#bbb}
#list .dot.sl{background:var(--ok)} #list .dot.sh{background:var(--bad)} #list .dot.sm{background:#c9c9c9}
#list .dot.ok{background:var(--ok)} #list .dot.low,#list .dot.high{background:var(--warn)} #list .dot.unknown{background:#8ab4f8}
#list .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .star{color:#d9a400}
#count{font-size:12px;color:var(--muted);padding:4px 14px 0}
main{flex:1;overflow:auto;padding:20px 28px 60px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--cat);border-radius:10px;padding:14px 18px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:14px;color:var(--cat);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.card.make{background:color-mix(in srgb,var(--cat) 7%,var(--panel))}
.rhead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;margin-bottom:12px}
.rhead h1{margin:0;font-size:28px;flex:1;min-width:200px;color:var(--title)}
.rhead .meta{color:var(--muted);width:100%;margin-top:-6px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.rtop{display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:100%}
.saltline{font-size:13.5px;text-align:right;max-width:560px;line-height:1.35}

const VALID_TAB = /^[a-z0-9][a-z0-9_-]{0,39}$/;

function normRecipe(r) {

      kind: KINDSET.has(i0.kind) ? i0.kind : 'other', salt_frac: null, fat_frac: null

    if (i.kind === 'saltmix' && i0.salt_frac !== null && i0.salt_frac !== undefined && isFinite(+i0.salt_frac)) i.salt_frac = +i0.salt_frac;

function importAll(ex) {

  const del = [], put = [], skipped = { cheese: 0 };

    r.id = uid(r0.id); r.created_at = t; r.updated_at = r0.updated_at || t; r.deleted = false; r.versions = [];

    body: [p.source && 'Recipe source: ' + p.source, p.score && 'Result: ' + p.score + '/10', p.observations && 'Observations:\n' + p.observations, p.mistakes && 'Mistakes:\n' + p.mistakes, p.improvements && 'Improvements for next time:\n' + p.improvements].filter(Boolean).join('\n\n') }));

    case 'POST notes': case 'PUT notes': {

      const nid = id || newId();

async function extractFile(file) {

const needWelcome = () => !!S && !S.recipes.length && !S.notes.length && !(S.trash || []).length;

  document.querySelector('header.top h1').innerHTML = '📖 Recipe Book <small class="hver">v' + VERSION + '</small>';
  document.title = 'Recipe Book v' + VERSION;
  $('#tabs').innerHTML = COLLS.map(c => '<button class="btn tab ' + (V.coll === c[0] && ['recipe','new','note','plog'].includes(V.page) ? 'on' : '') + '" data-coll="' + c[0] + '">' + c[1] + '</button>').join('');
  $$('#tabs [data-coll]').forEach(b => b.onclick = () => setColl(b.dataset.coll));
  $('#b-new').textContent = V.coll === 'notes' ? '＋ New note' : '＋ New recipe';
  $('#b-search').style.fontWeight = V.page === 'search' ? '800' : '';
  $('#b-ranges').hidden = V.coll !== 'sausage';
  $('#b-salt').style.fontWeight = V.page === 'salt' ? '800' : ''; $('#b-fat').style.fontWeight = V.page === 'fat' ? '800' : '';
}
async function setColl(c) {
  if (dirty && !(await confirmBox('<h3>Discard your changes?</h3><p>You have edits that have not been saved.</p>', 'Discard', true))) return;
  dirty = false; V.coll = c; V.edit = false; V.draft = null; V.logEdit = null; V.fromSearch = false;
  try { localStorage.setItem('rb.coll', c); } catch (e) {}
  if (c === 'notes') { V.page = 'note'; if (!S.notes.find(n => n.id === V.noteId)) V.noteId = (S.notes[0] || {}).id || null; }
  else {
    V.page = 'recipe'; let last = null; try { last = localStorage.getItem('rb.last.' + c); } catch (e) {}
    const lr = last && recipeById(+last);
    V.id = lr && collOf(lr) === c ? lr.id : (S.recipes.find(r => collOf(r) === c) || {}).id || null;
  }
  render();
}

/* ====================== sidebar list ====================== */
function renderList() {
  if (V.coll === 'notes') return renderNoteList();
  const q = $('#q').value.trim().toLowerCase(), f = $('#filter').value;
  $('#opt-bad').textContent = V.coll === 'sausage' ? 'Salt out of range' : 'High salt';
  const inColl = S.recipes.filter(r => collOf(r) === V.coll);
  const base = q ? S.recipes : inColl;
  const rs = base.filter(r => {
    if (f === 'fav' && !r.favorite) return false;
    if (f === 'bad') { if (collOf(r) === 'sausage') { const s = calc(r, 1).status; if (s !== 'low' && s !== 'high') return false; } else if (saltStatusOther(saltAnalysis(r, 1), collOf(r)) !== 'high') return false; }
    if (!q) return true;
    return r.name.toLowerCase().includes(q) || (r.category || '').toLowerCase().includes(q) || r.ingredients.some(i => i.name.toLowerCase().includes(q));
  });
  $('#count').textContent = q ? rs.length + ' matches in all recipe tabs' : rs.length + ' of ' + inColl.length + ' recipes';
  const groups = {}; rs.forEach(r => { const g = r.category || 'Uncategorised'; (groups[g] = groups[g] || []).push(r); });
  let h = '';
  Object.keys(groups).sort((a, b) => a.localeCompare(b)).forEach(g => {
    h += '<h3 style="--cat:' + catColour(g) + '">' + esc(g) + '</h3>';
    groups[g].forEach(r => {
      h += '<a style="--cat:' + catColour(g) + '" data-id="' + r.id + '" class="' + (V.page === 'recipe' && V.id === r.id ? 'sel' : '') + '">' + dotFor(r) + '<span class="nm">' + esc(r.name) + '</span>' + (q && collOf(r) !== V.coll ? '<span class="pill coll">' + esc(COLL_NAME[collOf(r)]) + '</span>' : '') + (r.favorite ? '<span class="star">★</span>' : '') + '</a>';
    });
  });
  $('#list').innerHTML = h || '<div class="empty">No recipes match.</div>';
}
function renderNoteList() {
  const q = $('#q').value.trim().toLowerCase();
  $('#opt-bad').hidden = true;
  const ns = S.notes.filter(n => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q) || n.kind.toLowerCase().includes(q));
  $('#count').textContent = ns.length + ' of ' + S.notes.length + ' notes';
  const groups = {}; ns.forEach(n => (groups[n.kind] = groups[n.kind] || []).push(n));
  let h = '';
  Object.keys(groups).sort((a, b) => a.localeCompare(b)).forEach(g => {
    h += '<h3 style="--cat:' + catColour(g) + '">' + esc(g) + '</h3>';
    groups[g].forEach(n => {
      h += '<a style="--cat:' + catColour(g) + '" data-note="' + n.id + '" class="' + (V.page === 'note' && V.noteId === n.id ? 'sel' : '') + '"><span class="nm">' + esc(n.title) + '</span>' + (n.file_path ? '<span class="pill">file</span>' : '') + '</a>';
    });
  });
  $('#list').innerHTML = h || '<div class="empty">No notes match.</div>';
}

/* ====================== recipe view ====================== */
function scalable(r) {   // ingredient names that have a weight we can scale by
  const seen = [];
  r.ingredients.forEach(i => { if (gramsOf(i, 1) > 0 && !seen.includes(i.name)) seen.push(i.name); });
  return seen;
}
function getScale(r) {
  let s = scaleState[r.id];
  if (!s) {
    const names = scalable(r);
    const refName = names.includes(r.ref) ? r.ref : (names[0] || '');
    const ing = r.ingredients.find(i => i.name === refName);
    s = scaleState[r.id] = { mode: 'ing', ing: refName, target: ing ? ing.amount : null, total: Math.round(calc(r, 1).total * 100) / 100 };
  }
  return s;
}
function factorOf(r) {
  const s = getScale(r);
  if (s.mode === 'total') {
    const base = calc(r, 1).total;
    return s.total > 0 && base > 0 ? s.total / base : 1;
  }
  const ing = r.ingredients.find(i => i.name === s.ing);
  if (ing && ing.amount > 0 && s.target > 0) return s.target / ing.amount;
  return 1;
}
function renderRecipe() {

        <button class="btn small" id="a-dup">Duplicate</button>

      <label><input type="radio" name="smode" value="total" ${sc.mode === 'total' ? 'checked' : ''}> By total weight</label>
      <span id="sc-ing" ${sc.mode === 'ing' ? '' : 'hidden'}>

  <div class="card" id="fatan-card" style="display:none"><h2>Fat analysis</h2><div id="fatan"></div></div>
  ${r.method.trim() ? `<div class="card"><h2>Method</h2><div class="rich">${steps(r.method)}</div></div>` : ''}
  ${r.notes.trim() ? `<div class="card"><h2>Notes</h2><div class="rich">${rich(r.notes)}</div></div>` : ''}
  ${r.source ? `<div class="card noprint"><h2>Source file</h2><div class="filebar"><code>${esc(linkName(r.source))}</code><button class="btn small" id="a-src">Open file</button><button class="btn small" id="a-srcf">Show in folder</button></div></div>` : ''}

    }
  };
  $$('input[name=smode]').forEach(el => el.onchange = () => { sc.mode = el.value; renderRecipe(); });

  $$('[data-mul]').forEach(b => b.onclick = () => {

  $('#sc-base').onclick = async () => {
    const f = factorOf(r); if (Math.abs(f - 1) < 1e-9) { toast('Already at the base amounts'); return; }
    if (!(await confirmBox('<h3>Use these amounts as the recipe?</h3><p>Every amount is multiplied by ' + fmtNum(f, 3) + ' and saved (you can undo this from History).</p>', 'Save'))) return;
    const d = clone(r); d.ingredients.forEach(i => { if (i.amount != null) i.amount = Math.round(i.amount * f * 1000) / 1000; });
    delete scaleState[r.id]; await saveRecipe(r.id, d);

}
function drawAmounts(r) {
  const f = factorOf(r), c = calc(r, f), base = calc(r, 1);
  const fe = $('#sc-factor'); if (fe) fe.textContent = '× ' + fmtNum(f, 3) + ' · batch ≈ ' + fmtNum(c.total) + ' g';
  const ps = $('#print-scale'); if (ps) ps.textContent = 'Scaled × ' + fmtNum(f, 3) + ' · batch ≈ ' + fmtNum(c.total) + ' g';
  const sa = collOf(r) === 'sausage', ncol = sa ? 5 : 4;
  let h = '<table><thead><tr><th>Ingredient</th><th class="num">Amount</th><th>Unit</th>' + (sa ? '<th class="num">% of meat</th>' : '') + '<th>Note</th></tr></thead><tbody>', last = null;
  r.ingredients.forEach(i => {
    if ((i.grp || '') !== last) { last = i.grp || ''; if (last) h += '<tr class="grp"><td colspan="' + ncol + '">' + esc(last) + '</td></tr>'; }
    const g = gramsOf(i, f);
    const pct = g != null && c.meat > 0 && i.kind !== 'meat' ? fmtNum(g / c.meat * 100, 2) + '%' : '';
    h += '<tr class="' + (i.kind === 'salt' ? 'key' : '') + '"><td>' + esc(i.name) + '</td><td class="num">' + (i.amount == null ? '<span class="muted">–</span>' : esc(fmtNum(i.amount * f))) + '</td><td>' + esc(i.unit) + '</td>' + (sa ? '<td class="num muted">' + pct + '</td>' : '') + '<td class="note">' + esc(i.note) + '</td></tr>';
  });
  h += '</tbody></table>';
  $('#amounts').innerHTML = h;
  if (sa) { drawSaltLine(r, f, c); drawChecks(r, c, base); } else drawSaltOther(r, f);
  drawFat(r, f);
  drawLoin(r, f);
}
function showAnalysis(r, kind) {
  const sa = collOf(r) === 'sausage';
  const src = kind === 'fat' ? $('#fatan') : (sa ? $('#checks') : $('#saltan'));
  if (!src) return;
  const title = kind === 'fat' ? 'Fat analysis' : (sa ? 'Salt & cure check' : 'Salt analysis');
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = '<div class="modal wide"><h3>' + esc(title) + ': ' + esc(r.name) + '</h3><div class="pop-body"></div><div class="row"><button class="btn primary">Close</button></div></div>';
  const body = o.querySelector('.pop-body'); body.innerHTML = src.innerHTML;
  const fb = body.querySelector('#fix-salt'); if (fb) fb.onclick = () => { o.remove(); applyFix(r); };
  const onKey = ev => { if (ev.key === 'Escape') close(); };
  const close = () => { o.remove(); document.removeEventListener('keydown', onKey); };
  o.addEventListener('mousedown', ev => { if (ev.target === o) close(); });
  o.querySelector('.row button').onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.appendChild(o);
}
function drawChecks(r, c) {
  const el = $('#checks'); let h = '';
  if (r.salt_class === 'none' || !c.target) {
    h += '<p class="muted">This recipe has no salt rule (for example a brine or a surface cure). You can change that when you edit it.</p>';
  } else if (c.status === 'unknown') {
    h += '<div class="check"><span class="badge unknown">Salt unknown</span><span>Set the salt content of “' + esc(c.unknown.join(', ')) + '” (edit the recipe, Type = “Cure/mix with some salt”) so the salt check can work.</span></div>';
  } else if (c.basis <= 0) {
    h += '<p class="muted">Add a meat weight to check the salt level.</p>';
  } else {
    const lo = c.target[0], hi = c.target[1], max = Math.max(hi * 1.6, (c.pct || 0) * 1.15, 3);
    const pos = x => Math.min(100, Math.max(0, x / max * 100)) + '%';
    h += `<div class="check"><span class="big">${fmtPct(c.pct)}</span><span class="badge ${c.status}">${c.status === 'ok' ? 'Within target' : c.status === 'low' ? 'Below target' : 'Above target'}</span>
      <span class="muted">target ${lo}–${hi}% of ${r.salt_basis === 'total' ? 'the whole mix' : 'meat + fat'}</span></div>
      <div class="track"><div class="band" style="left:${pos(lo)};width:calc(${pos(hi)} - ${pos(lo)})"></div><div class="mark" style="left:calc(${pos(c.pct)} - 2px)"></div></div>
      <div class="ticks"><span>0%</span><span>${fmtNum(max, 1)}%</span></div>
      <p class="help">Salt in the batch: <b>${fmtNum(c.salt)} g</b>${c.cureG + c.cure2G > 0 ? ' (includes ' + fmtNum(c.cureG * CURE_SALT + c.cure2G * CURE2_SALT) + ' g from the cure)' : ''} on ${fmtNum(c.basis)} g of ${r.salt_basis === 'total' ? 'mix' : 'meat + fat'}.</p>`;
    if (c.status === 'low' || c.status === 'high') {
      const p = proposeSalt(r);
      if (p && p.error) h += '<p class="help">' + esc(p.error) + '</p>';
      else if (p) h += `<button class="btn small noprint" id="fix-salt">Set salt to ${fmtPct(p.after.pct)} (${fmtNum(p.oldG, 2)} g → ${fmtNum(p.newG, 2)} g at the base recipe amounts)</button>`;
    }
  }
  if (c.nitrite != null && c.cureG + c.cure2G > 0) {
    const hi = c.nitrite > 165;
    h += `<p class="help">Nitrite from the cure: <b>${fmtNum(c.nitrite, 0)} mg/kg</b> of meat <span class="badge ${hi ? 'high' : 'ok'}">${hi ? 'above the usual 156 mg/kg' : 'normal'}</span> (Cure #1 or #2 at 0.25% of the meat gives 156 mg/kg; the UK/EU limit for added nitrite is 150 mg/kg).</p>`;
  }
  if (c.nitrate != null && c.nitrate > 0) {
    const hi = c.nitrate > 150;
    h += `<p class="help">Nitrate (saltpetre and Cure #2): <b>${fmtNum(c.nitrate, 0)} mg/kg</b> of meat ${hi ? '<span class="badge high">high</span> This is well above the roughly 150 mg/kg added-nitrate limit that normally applies, although some traditional dry cures are allowed more. Check this amount.' : '<span class="badge ok">normal</span>'}</p>`;
  }
  el.innerHTML = h || '<p class="muted">Nothing to check.</p>';
  const fb = $('#fix-salt'); if (fb) fb.onclick = () => applyFix(r);
}
async function applyFix(r) {
  const p = proposeSalt(r); if (!p || p.error) { if (p) toast(p.error, true); return; }
  if (!(await confirmBox('<h3>Adjust the salt in “' + esc(r.name) + '”?</h3><p>Salt ' + fmtNum(p.oldG, 2) + ' g → ' + fmtNum(p.newG, 2) + ' g (' + fmtPct(p.before.pct) + ' → ' + fmtPct(p.after.pct) + '). Nothing else changes, and you can undo it from History.</p>', 'Adjust'))) return;
  await saveRecipe(r.id, p.recipe);
}
async function saveRecipe(id, data) {
  try {
    const out = await api('PUT', '/api/recipes/' + id, data);
    await load(); V.id = out.id; V.edit = false; V.draft = null; dirty = false; render(); toast('Saved');
  } catch (e) { toast(e.message, true); }
}
async function showHistory(r) {
  let vs = []; try { vs = await api('GET', '/api/recipes/' + r.id + '/versions'); } catch (e) { toast(e.message, true); return; }
  if (!vs.length) { await modal('<h3>History</h3><p class="muted">No earlier versions yet. A copy of the old recipe is kept each time you save a change.</p>', [{label:'Close',value:null,cls:'primary'}]); return; }
  const html = '<h3>Earlier versions of ' + esc(r.name) + '</h3><p class="help">Restoring keeps your current version in this list too.</p><table>' +
    vs.map(v => '<tr><td>' + esc(v.saved_at) + '</td><td class="muted">' + esc(v.name) + '</td><td><button class="btn small" data-v="' + v.id + '">Restore</button></td></tr>').join('') + '</table>';
  const o = document.createElement('div'); o.className = 'overlay'; o.innerHTML = '<div class="modal">' + html + '<div class="row"><button class="btn primary">Close</button></div></div>';
  o.addEventListener('mousedown', e => { if (e.target === o) o.remove(); });
  $('.row button', o).onclick = () => o.remove();
  $$('[data-v]', o).forEach(b => b.onclick = async () => {
    try { await api('POST', '/api/versions/' + b.dataset.v + '/restore'); o.remove(); await load(); delete scaleState[r.id]; render(); toast('Restored'); } catch (e) { toast(e.message, true); }
  });
  document.body.appendChild(o);
}

/* ====================== recipe editor ====================== */

}

const IMP = (() => {

    if ((m = s.match(new RegExp('^(\\d+(?:[.,]\\d+)*)\\s?([' + FRCH + '])$')))) return parseNum(m[1]) + FR[m[2]];

    ml: 'ml', millilitre: 'ml', millilitres: 'ml', milliliter: 'ml', milliliters: 'ml', l: 'l', litre: 'l', litres: 'l', liter: 'l', liters: 'l', dl: 'dl', cl: 'cl',
    tsp: 'tsp', tsps: 'tsp', teaspoon: 'tsp', teaspoons: 'tsp', tbsp: 'tbsp', tbsps: 'tbsp', tbs: 'tbsp', tbl: 'tbsp', tablespoon: 'tbsp', tablespoons: 'tbsp',
    dssp: 'dssp', dsp: 'dssp', dessertspoon: 'dssp', dessertspoons: 'dssp', cup: 'cup', cups: 'cup', pint: 'pint', pints: 'pint', pt: 'pint', quart: 'quart', quarts: 'quart', gallon: 'gallon', gallons: 'gallon',
    pinch: 'pinch', pinches: 'pinch', clove: 'clove', cloves: 'clove', bunch: 'bunch', bunches: 'bunch', sprig: 'sprig', sprigs: 'sprig', slice: 'slice', slices: 'slice',
    stick: 'stick', sticks: 'stick', can: 'can', cans: 'can', tin: 'tin', tins: 'tin', packet: 'packet', packets: 'packet', handful: 'handful', handfuls: 'handful',

/* ====================== salt report ====================== */
V.rs = { salt: { key: 'name', dir: 1 }, fat: { key: 'name', dir: 1 } }; V.salt = { tab: 'sausage' }; V.fat = { tab: 'all', level: '' };
const NUM_KEYS = new Set(['pct', 'level', 'total', 'fat', 'counted']);
function thSort(rep, key, label, cls) { const s = V.rs[rep]; return '<th class="sortable ' + (cls || '') + '" data-sort="' + rep + ':' + key + '" title="Click to sort">' + label + (s.key === key ? (s.dir > 0 ? ' ▲' : ' ▼') : '') + '</th>'; }
function bindSort(rep, redraw) {
  $$('th[data-sort^="' + rep + ':"]').forEach(th => th.onclick = () => {
    const k = th.dataset.sort.split(':')[1], s = V.rs[rep];
    const d = s.def || (s.def = { key: s.key, dir: s.dir }), first = NUM_KEYS.has(k) ? -1 : 1;
    if (s.key === k) { if (s.dir === first) s.dir = -first; else { s.key = d.key; s.dir = d.dir; } } else { s.key = k; s.dir = first; }
    redraw();
  });
}
function sortRows(rep, rows, get) {
  const s = V.rs[rep], g = get[s.key] || get.name;
  return rows.slice().sort((a, b) => {
    const x = g(a), y = g(b);
    if (x == null && y == null) return a.r.name.localeCompare(b.r.name);
    if (x == null) return 1; if (y == null) return -1;
    const c = typeof x === 'string' ? x.localeCompare(y) : x - y;
    return c * s.dir || a.r.name.localeCompare(b.r.name);
  });
}
const tabSelectHtml = (id, sel) => '<select id="' + id + '"><option value="all" ' + (sel === 'all' ? 'selected' : '') + '>All tabs</option>' + tabList().map(t => '<option value="' + esc(t.id) + '" ' + (sel === t.id ? 'selected' : '') + '>' + esc((t.emoji ? t.emoji + ' ' : '') + t.label) + '</option>').join('') + '</select>';
const LEVEL_RANK = { high: 3, med: 2, ok: 2, low: 1, na: 0 };
const LEVEL_TXT = { high: 'High', med: 'Medium', ok: 'OK', low: 'Low', na: '–' };

}

/* ====================== salt ranges page ====================== */
function renderRanges() {
  const t = targets(), fmtR = a => a[0] + ' - ' + a[1] + '%';
  const ruleOf = r => r.salt_class === 'none' ? 'none' : r.salt_class + '|' + r.salt_basis;
  const ruleText = k => {
    if (k === 'none') return { range: 'No salt range', note: 'brines, surface cures, recipes with no set amount' };
    const [c, b] = k.split('|');
    return { range: fmtR(t[c]), note: (c === 'fresh' ? 'fresh-sausage rule' : 'cured / smoked rule') + (b === 'total' ? ', measured on the whole mix' : '') };
  };
  const count = f => SR().filter(f).length;
  const cats = {}; SR().forEach(r => (cats[r.category || 'Uncategorised'] = cats[r.category || 'Uncategorised'] || []).push(r));
  let h = `<div class="rhead"><h1>Salt ranges</h1><div class="actions"><button class="btn small" id="rg-set">Change the ranges in Settings</button></div></div>
  <p class="help">The salt level each type of product is checked against, as a percentage of the meat + fat in the recipe (the whole mix for puddings). Each recipe is checked against the range for its type; you choose a recipe's type when you edit it.</p>
  <div class="card"><h2>The ranges</h2><table><thead><tr><th>Type of product</th><th>Salt range</th><th>Recipes</th></tr></thead><tbody>
    <tr><td><b>Fresh sausage</b></td><td><b>${fmtR(t.fresh)}</b></td><td>${count(r => r.salt_class === 'fresh')}</td></tr>
    <tr><td><b>Cured / smoked</b> <span class="muted">(including Cure #1 / #2 salt)</span></td><td><b>${fmtR(t.cured)}</b></td><td>${count(r => r.salt_class === 'cured')}</td></tr>
    <tr><td><b>No range</b> <span class="muted">(brines, surface cures)</span></td><td class="muted">none</td><td>${count(r => r.salt_class === 'none')}</td></tr>
  </tbody></table></div>
  <div class="card"><h2>By category</h2><table><thead><tr><th>Category</th><th>Salt range</th><th>Recipes</th></tr></thead><tbody>`;
  Object.keys(cats).sort((a, b) => a.localeCompare(b)).forEach(cat => {
    const groups = {}; cats[cat].forEach(r => (groups[ruleOf(r)] = groups[ruleOf(r)] || []).push(r));
    const keys = Object.keys(groups).sort();
    keys.forEach((k, n) => {
      const rt = ruleText(k);
      h += '<tr>' + (n === 0 ? '<td rowspan="' + keys.length + '" style="border-left:5px solid ' + catColour(cat) + ';font-weight:700;color:' + catColour(cat) + '">' + esc(cat) + '</td>' : '') +
        '<td style="white-space:nowrap"><b>' + esc(rt.range) + '</b>' + (k !== 'none' && k.endsWith('total') ? '<br><span class="muted" style="font-size:12px">whole mix</span>' : '') + '</td><td>' +
        groups[k].map(r => '<a href="#" data-open="' + r.id + '">' + esc(r.name) + '</a>').join(', ') + '</td></tr>';
    });
  });
  h += '</tbody></table></div>';
  $('#main').innerHTML = h;
  $('#rg-set').onclick = () => go('settings');
  $$('[data-open]').forEach(a => a.onclick = e => { e.preventDefault(); go('recipe', +a.dataset.open); });
}

  if (!ts.find(t => t.id === V.refTab)) V.refTab = ts[0].id;
  const t = clone(ts.find(x => x.id === V.refTab));
  m.innerHTML = `<div class="rhead"><h1>Reference</h1><div class="actions"><button class="btn primary small" id="r-new">＋ New table</button></div></div>
  <div class="tabs">${ts.map(x => '<button class="btn ' + (x.id === V.refTab ? 'on' : '') + '" data-tab="' + x.id + '">' + esc(x.name) + '</button>').join('')}</div>
  <div class="card">
    <div class="form-grid"><label class="f">Table name<input id="r-name" value="${esc(t.name)}"></label><label class="f">Note<input id="r-note" value="${esc(t.note)}"></label></div>
    <div style="overflow-x:auto"><table class="edit" id="r-grid"></table></div>
    <p class="row-inline" style="margin-top:10px"><button class="btn small" id="r-addrow">＋ Row</button><button class="btn small" id="r-addcol">＋ Column</button>
      <span class="spacer"></span><button class="btn small danger" id="r-del">Delete table</button><button class="btn primary" id="r-save">Save table</button></p>
  </div>`;
  const grid = () => {
    $('#r-grid').innerHTML = '<thead><tr>' + t.columns.map((c, j) => `<th><input data-h="${j}" value="${esc(c)}" style="font-weight:600"><button class="mvb" data-delcol="${j}" title="Remove column">✕</button></th>`).join('') + '<th></th></tr></thead><tbody>' +
      t.rows.map((r, i) => '<tr>' + t.columns.map((c, j) => `<td><input data-r="${i}" data-c="${j}" value="${esc(r[j] == null ? '' : r[j])}"></td>`).join('') + `<td><button class="mvb" data-delrow="${i}" title="Remove row">✕</button></td></tr>`).join('') + '</tbody>';
  };
  grid();
  $('#r-grid').oninput = e => {
    const el = e.target; dirty = true;
    if (el.dataset.h != null) t.columns[+el.dataset.h] = el.value; else if (el.dataset.r != null) { t.rows[+el.dataset.r][+el.dataset.c] = el.value; }
  };
  $('#r-grid').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.delrow != null) t.rows.splice(+b.dataset.delrow, 1);
    if (b.dataset.delcol != null) { const j = +b.dataset.delcol; t.columns.splice(j, 1); t.rows.forEach(r => r.splice(j, 1)); }
    dirty = true; grid();
  };
  $('#r-addrow').onclick = () => { t.rows.push(t.columns.map(() => '')); dirty = true; grid(); const ins = $$('#r-grid tbody tr:last-child input'); if (ins[0]) ins[0].focus(); };
  $('#r-addcol').onclick = () => { t.columns.push('New column'); t.rows.forEach(r => r.push('')); dirty = true; grid(); };
  $('#r-name').oninput = e => { t.name = e.target.value; dirty = true; };
  $('#r-note').oninput = e => { t.note = e.target.value; dirty = true; };
  $('#r-save').onclick = async () => { try { await api('PUT', '/api/ref_tables/' + t.id, t); dirty = false; await load(); renderRefs(); toast('Saved'); } catch (er) { toast(er.message, true); } };
  $('#r-del').onclick = async () => { if (await confirmBox('<h3>Delete the table “' + esc(t.name) + '”?</h3><p>This cannot be undone (apart from restoring a backup).</p>', 'Delete', true)) { await api('DELETE', '/api/ref_tables/' + t.id); await load(); V.refTab = null; dirty = false; renderRefs(); } };
  $('#r-new').onclick = newRef;
  $$('[data-tab]').forEach(b => b.onclick = async () => { if (dirty && !(await confirmBox('<h3>Discard your changes?</h3>', 'Discard', true))) return; dirty = false; V.refTab = +b.dataset.tab; renderRefs(); });
}
function drawSmartCard() {
  const c = $('#smart-card'); if (!c) return;
  const sm = S.smart || {}, on = !!(S.settings && S.settings.smart_import), model = S.smart_model || 'claude-sonnet-5-5';
  c.innerHTML = `<h2>Smart import (optional)</h2>
    <p class="help">Importing from a file always works on this computer. If you add an Anthropic API key you can also let Claude read the file, which copes better with untidy PDFs and web-page clutter. <b>When you use it, the text of the file you are importing is sent to Anthropic;</b> nothing is sent otherwise. Use is charged to your Anthropic account (typically a few pence per recipe). The key is stored encrypted for your Windows user in your profile folder, not in the recipe database, backups or exports.</p>
    <div class="form-grid" style="max-width:640px">
      <label class="f">API key${sm.has_key ? ' (saved, ends …' + esc(sm.last4) + ')' : ''}<input id="sm-key" type="password" autocomplete="off" placeholder="${sm.has_key ? 'Paste a new key to replace it' : 'sk-ant-…'}"></label>
      <label class="f">Model<input id="sm-model" value="${esc(model)}"></label></div>
    <p class="row-inline"><button class="btn small" id="sm-save">Save key</button>${sm.has_key ? ' <button class="btn small" id="sm-test">Test</button> <button class="btn small danger" id="sm-del">Remove key</button>' : ''}
      <label class="row-inline" style="text-transform:none;font-weight:400"><input type="checkbox" id="sm-on" ${on ? 'checked' : ''} ${sm.has_key ? '' : 'disabled'} style="width:auto"> Use Smart import by default</label></p>`;
  const refresh = async () => { await load(); drawSmartCard(); };
  $('#sm-save').onclick = async () => { const k = $('#sm-key').value.trim(); if (!k) { toast('Paste the key first', true); return; } try { await api('POST', '/api/smart/key', { key: k }); await refresh(); toast('Key saved'); } catch (e) { toast(e.message, true); } };
  $('#sm-model').onchange = async e => { try { await api('PUT', '/api/settings', { smart_model: e.target.value.trim() }); await refresh(); toast('Model saved'); } catch (er) { toast(er.message, true); } };
  $('#sm-on').onchange = async e => { try { await api('PUT', '/api/settings', { smart_import: e.target.checked }); await refresh(); } catch (er) { toast(er.message, true); } };
  if ($('#sm-test')) $('#sm-test').onclick = async () => { toast('Testing…'); try { const r = await api('POST', '/api/smart/test'); toast('Connected (' + r.model + ')'); } catch (e) { toast(e.message, true); } };
  if ($('#sm-del')) $('#sm-del').onclick = async () => { if (!(await confirmBox('<h3>Remove the API key?</h3><p>Smart import stops working until you add a key again.</p>', 'Remove', true))) return; try { await api('POST', '/api/smart/key', { key: '' }); await api('PUT', '/api/settings', { smart_import: false }); await refresh(); toast('Key removed'); } catch (e) { toast(e.message, true); } };
}
async function newRef() {
  try { const r = await api('POST', '/api/ref_tables', { name: 'New table ' + (S.ref_tables.length + 1), columns: ['Column 1', 'Column 2'], rows: [['', '']], note: '' }); await load(); V.page = 'refs'; V.refTab = r.id; render(); } catch (e) { toast(e.message, true); }
}

  </div><div class="stab" data-st="meas">

    <p><button class="btn small" id="u-add">＋ Add unit</button></p></div>
  </div><div class="stab" data-st="data">

  const stShow = n => { V.stab = n; $$('.stab').forEach(d => { d.hidden = d.dataset.st !== n; }); $$('[data-stb]').forEach(b => b.classList.toggle('on', b.dataset.stb === n)); $('#st-save').hidden = n === 'data' || n === 'org'; };
  $$('[data-stb]').forEach(b => { b.onclick = () => stShow(b.dataset.stb); }); stShow(V.stab || 'org');
  const ug = () => { $('#u-grid').innerHTML = '<thead><tr><th>Unit</th><th>Grams each</th><th></th></tr></thead><tbody>' + Object.keys(un).map(k => `<tr><td><input data-uk="${esc(k)}" value="${esc(k)}"></td><td><input data-uv="${esc(k)}" inputmode="decimal" value="${esc(un[k])}"></td><td><button class="mvb" data-ud="${esc(k)}">✕</button></td></tr>`).join('') + '</tbody>'; };
  ug();
  $('#u-grid').onchange = e => {
    const el = e.target;
    if (el.dataset.uv != null) { const x = parseFloat(String(el.value).replace(',', '.')); if (!isNaN(x)) un[el.dataset.uv] = x; }
    if (el.dataset.uk != null) { const old = el.dataset.uk, nw = el.value.trim().toLowerCase(); if (nw && nw !== old) { un[nw] = un[old]; delete un[old]; } ug(); }
  };
  $('#u-grid').onclick = e => { const b = e.target.closest('[data-ud]'); if (b) { delete un[b.dataset.ud]; ug(); } };
  $('#u-add').onclick = () => { un['unit' + (Object.keys(un).length + 1)] = 1; ug(); };

  const cg = () => { $('#cu-grid').innerHTML = '<thead><tr><th>Unit</th><th>Grams each</th><th></th></tr></thead><tbody>' + Object.keys(cu).map(k => `<tr><td><input data-ck="${esc(k)}" value="${esc(k)}"></td><td><input data-cv="${esc(k)}" inputmode="decimal" value="${cu[k]}"></td><td><button class="x" data-cd="${esc(k)}" title="Remove">×</button></td></tr>`).join('') + '</tbody>'; };

    const cleanNorms = norms.filter(n => n.match && (n.salt != null || n.each != null || n.fat != null || n.liquid != null));
    try { await api('PUT', '/api/settings', { salt_targets: { fresh: [f0, f1], cured: [c0, c1] }, units: un, salt_targets_other: ot, fat_targets: ft, ingredient_norms: cleanNorms, norms_version: NORMS_VERSION, count_units: cu }); await load(); render(); toast('Settings saved'); } catch (e) { toast(e.message, true); }

  const stNow = () => { const e = $('#sync-now-state'); if (e) e.textContent = ($('#sync') || {}).textContent || ''; }; stNow();
  $('#d-sync').onclick = async () => { await syncNow(); render(); toast('Synced'); };
  $('#d-status').onclick = showDiag;
  $('#d-signin').onclick = async () => { try { await Drive.signIn(); await syncNow(); render(); } catch (e) { toast('Sign-in did not complete: ' + (e.message || e), true); } };
  $('#d-allow').onclick = async () => { try { if (!Drive.allowRead) throw new Error('Not available in test mode'); await Drive.allowRead(); toast('Allowed'); } catch (e) { toast(e.message || String(e), true); } };

    const blob = new Blob([JSON.stringify(exportData(), null, 1)], { type: 'application/json' }), a = document.createElement('a');

  };
  $$('[data-un]').forEach(b => b.onclick = async () => { try { await api('POST', '/api/recipes/' + b.dataset.un + '/undelete'); await load(); render(); toast('Restored'); } catch (e) { toast(e.message, true); } });
  $$('[data-pg]').forEach(b => b.onclick = async () => { if (await confirmBox('<h3>Delete forever?</h3><p>This recipe cannot be recovered afterwards.</p>', 'Delete forever', true)) { await api('DELETE', '/api/recipes/' + b.dataset.pg + '?purge=1'); await load(); render(); } });
}

$('#b-search').onclick = () => { V.fromSearch = false; go('search'); };
$('#b-refs').onclick = () => go('refs');
$('#b-settings').onclick = () => go('settings');
(function () {
  const app = $('#app'), set = c => { app.classList.toggle('nc', c); try { localStorage.setItem('rb:nav', c ? '1' : '0'); } catch (e) {} };
  let c = false; try { c = localStorage.getItem('rb:nav') === '1'; } catch (e) {}
  set(c); $('#b-nav').onclick = () => set(!app.classList.contains('nc'));
})();
$('#b-quit').onclick = async () => {
  if (dirty && !confirm('You have unsaved changes on this page. Quit anyway?')) return;
  const t0 = Date.now();
  while ((Q.length || busy) && stat !== 'signin' && stat !== 'offline' && Date.now() - t0 < 8000) { if (!busy) flushQ(); await new Promise(r => setTimeout(r, 300)); }
  if (Q.length && !confirm(Q.length + ' change(s) are not saved to Drive yet. They stay on this device and are sent next time. Quit anyway?')) return;
  dirty = false; window.close();
  setTimeout(() => toast('The browser did not allow Quit to close this window. Close it with the X in the corner (on the tablet, swipe the app away).', true), 500);
};
$('#q').oninput = () => renderList();
$('#q').onkeydown = e => { if (e.key === 'Enter' && $('#q').value.trim()) { e.preventDefault(); V.sf.q = $('#q').value.trim(); V.fromSearch = false; go('search'); } };
$('#filter').onchange = () => renderList();
$('#list').onclick = e => { const a = e.target.closest('a[data-id],a[data-note],a[data-page]'); if (!a) return; V.fromSearch = false; if (a.dataset.id) go('recipe', +a.dataset.id); else if (a.dataset.note) { V.noteId = +a.dataset.note; go('note'); } else go(a.dataset.page); };
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
(async function boot() {
  try {
    await load(); startView(); window.__rbReady = true; render();
    setStat('loading'); if (Drive.init) Drive.init();
    const had = S.recipes.length + S.notes.length;
    await syncNow();
    if (!had && (S.recipes.length + S.notes.length)) { startView(); render(); }
    else if (needWelcome()) renderWelcome();
  } catch (e) {
    $('#main').innerHTML = '<div class="empty">Could not load your recipes: ' + esc(e.message) + '</div>';
  }
  $('#sync').onclick = async () => { if (stat === 'signin') { try { await Drive.signIn(); await syncNow(); } catch (e) { toast('Sign-in did not complete', true); } } else showDiag(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastPull > 30000) syncNow(); });
  window.addEventListener('online', () => syncNow());
  setInterval(() => { if (!document.hidden && !dirty && Date.now() - lastPull > 120000) syncNow(); }, 60000);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
